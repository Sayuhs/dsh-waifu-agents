<circle cx="200" cy="410" r="5.5" fill="#94a3b8"/><text x="213" y="414">清单在、0 次调用</text>
<circle cx="340" cy="410" r="5.5" fill="#b45309"/><text x="353" y="414">带工具真干活</text>
<g stroke="#656d76" stroke-width="1.4" opacity="0.6"><line x1="440" y1="410" x2="470" y2="410"/><line x1="440" y1="406" x2="440" y2="414"/><line x1="470" y1="406" x2="470" y2="414"/></g>
<text x="478" y="414">实测最小–最大</text>
</g>
<g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#656d76">
<text x="26" y="436">① 只算输入（inputTokens + cacheReadTokens），不含输出。样本：插件单人聊天 7 轮、团队讨论 7 轮、默认模式 4 轮（均单轮）、单人干活 5 轮、团队预设 63 轮、裸平台干活 131 轮。</text>
<text x="26" y="452">② 干活侧波动极大：裸平台 8 万–1.23 亿（那场仍在增长）、团队预设 4 万–4,062 万、单人干活 69 万–1,533 万；任务不同，只比量级。</text>
<text x="26" y="468">③ 「不用插件」≠「不背工具」：默认模式自带 25–28 个工具、约 5,200–5,500 token，一句闲聊也照付，所以比插件聊天贵近一倍。</text>
<text x="26" y="484">④ 空心点＝闸门前单人首轮 10,157（含 6,957 清单）；「团队预设干活」不是团队：挂着预设却从未触发讨论，实为单人 agent 干活。</text>
</g>
</svg>