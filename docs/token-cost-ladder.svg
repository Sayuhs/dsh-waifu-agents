<text x="26" y="50" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#656d76">插件聊天 3,736、团队讨论 3,094，而不用插件的默认模式是 6,361——它自带一份工具清单，纯聊天也照付。横轴对数，每格 ×10。</text>
