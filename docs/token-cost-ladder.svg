<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="一轮输入 token 的量级对比：团队讨论、单人聊天、裸聊都在几千；闸门前单人聊天背了约 7 千 token 的清单；真开始调工具就跳到百万级">
