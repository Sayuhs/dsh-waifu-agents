<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="累计输入 token 的名义值与缓存折算值：单人聊天 7 轮名义 2.4 万、折算 4,535；带工具清单那档每轮全价重发，7 轮 5.5 万；干活 5 轮名义 2,270 万、折算 261 万">
<rect width="960" height="500" fill="#ffffff"/>
<text x="26" y="30" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#1f2328">多轮之后会不会越聊越贵：名义输入 vs 缓存折算</text>
<text x="26" y="50" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#656d76">工具清单只在请求里带，从不出现在回复里；带过一次之后进缓存，按 1/10 计价。图中每轮实线是账面上的输入 token，蓝虚线是扣掉缓存折扣后的实际计费。</text>
<g stroke="#eef1f5" stroke-width="1">
