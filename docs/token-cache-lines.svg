<text x="574" y="128.3" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10" fill="#656d76" paint-order="stroke" stroke="#ffffff" stroke-width="3.2" stroke-linejoin="round">会话越长，两条线的口子撕得越大</text>
<g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#1f2328">
<rect x="90" y="424" width="12" height="3" fill="#94a3b8"/><text x="108" y="428">清单在、每轮全价</text>
<rect x="248" y="424" width="12" height="3" fill="#0d9488"/><text x="266" y="428">工具收走、命中缓存</text>
<rect x="404" y="424" width="12" height="3" fill="#b45309"/><text x="422" y="428">带工具干活</text>
<line x1="520" y1="426" x2="546" y2="426" stroke="#2f6feb" stroke-width="2.2" stroke-dasharray="5 4"/><text x="554" y="428" fill="#2f6feb">缓存折算后</text>
</g>
<g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#656d76">
<text x="26" y="452">① 名义＝inputTokens＋cacheReadTokens；折算＝inputTokens＋cacheReadTokens×0.1（缓存读 1/10 价，与 Anthropic / DeepSeek 同口径）。只算输入，输出另计。</text>
<text x="26" y="468">② 左灰线 7 轮里 6 轮 cacheRead＝0：前缀没命中，等于每轮把 1 万人设＋清单重发一遍；摘掉工具后第 2 轮起命中 90%。贵不贵看前缀稳不稳，不看聊了几轮。</text>
<text x="26" y="484">③ 右图 98.3% 的输入是缓存读；另一场 40 轮会话同理（98.2%，名义 3.6 亿 / 折算 4,193 万）。会话越长，名义涨得越陡，折算几乎贴着地走。</text>
</g>
</svg>