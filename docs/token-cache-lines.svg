<text x="570" y="70" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600" fill="#1f2328">带工具干活：5 轮实测</text>
<text x="570" y="86" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="10.5" fill="#656d76">一场 516 次工具调用的会话</text>
