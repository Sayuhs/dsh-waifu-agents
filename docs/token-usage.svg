<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="三种模式的累计输入 token 随轮次增长：单人/裸平台随轮次二次增长，团队每轮恒定">
  <rect width="800" height="420" fill="#ffffff"/>

  <text x="26" y="26" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#1f2328">累计输入 token 随轮次增长</text>

  <!-- grid -->
  <g stroke="#eef1f5" stroke-width="1">
    <line x1="110" y1="40" x2="680" y2="40"/>
    <line x1="110" y1="120" x2="680" y2="120"/>
    <line x1="110" y1="200" x2="680" y2="200"/>
    <line x1="110" y1="280" x2="680" y2="280"/>
  </g>
  <line x1="110" y1="360" x2="680" y2="360" stroke="#d0d7de" stroke-width="1"/>
  <line x1="110" y1="40" x2="110" y2="360" stroke="#d0d7de" stroke-width="1"/>

  <!-- y ticks -->
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#656d76" text-anchor="end">
    <text x="100" y="44">200 万</text>
    <text x="100" y="124">150 万</text>
    <text x="100" y="204">100 万</text>
    <text x="100" y="284">50 万</text>
    <text x="100" y="364">0</text>
  </g>

  <!-- x ticks -->
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11" fill="#656d76" text-anchor="middle">
    <text x="110" y="380">0</text>
    <text x="224" y="380">10</text>
    <text x="338" y="380">20</text>
    <text x="452" y="380">30</text>
    <text x="566" y="380">40</text>
    <text x="680" y="380">50</text>
  </g>
  <text x="395" y="402" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#656d76" text-anchor="middle">轮数</text>
  <text x="26" y="200" transform="rotate(-90 26 200)" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#656d76" text-anchor="middle">累计输入 token</text>

  <!-- series: bare platform -->
  <polyline fill="none" stroke="#6b7280" stroke-width="2" points="121.4,358.7 144.2,355.6 224.0,339.0 338.0,300.2 680.0,76.6"/>
  <g fill="#ffffff" stroke="#6b7280" stroke-width="2">
    <circle cx="121.4" cy="358.7" r="3"/>
    <circle cx="144.2" cy="355.6" r="3"/>
    <circle cx="224.0" cy="339.0" r="3"/>
    <circle cx="338.0" cy="300.2" r="3"/>
    <circle cx="680.0" cy="76.6" r="3"/>
  </g>

  <!-- series: solo (projected beyond round 1) -->
  <polyline fill="none" stroke="#2f6feb" stroke-width="2" stroke-dasharray="6 4" points="121.4,358.4 144.2,354.6 224.0,335.9 338.0,293.9 680.0,60.9"/>
  <g fill="#ffffff" stroke="#2f6feb" stroke-width="2">
    <circle cx="121.4" cy="358.4" r="3"/>
    <circle cx="144.2" cy="354.6" r="3"/>
    <circle cx="224.0" cy="335.9" r="3"/>
    <circle cx="338.0" cy="293.9" r="3"/>
    <circle cx="680.0" cy="60.9" r="3"/>
  </g>

  <!-- series: team of 3 -->
  <polyline fill="none" stroke="#d97706" stroke-width="2" points="121.4,359.3 144.2,357.9 224.0,353.1 338.0,346.2 680.0,325.4"/>
  <g fill="#ffffff" stroke="#d97706" stroke-width="2">
    <circle cx="121.4" cy="359.3" r="3"/>
    <circle cx="144.2" cy="357.9" r="3"/>
    <circle cx="224.0" cy="353.1" r="3"/>
    <circle cx="338.0" cy="346.2" r="3"/>
    <circle cx="680.0" cy="325.4" r="3"/>
  </g>

  <!-- series: team of 2 -->
  <polyline fill="none" stroke="#0d9488" stroke-width="2" points="121.4,359.6 144.2,358.8 224.0,356.0 338.0,352.1 680.0,340.1"/>
  <g fill="#ffffff" stroke="#0d9488" stroke-width="2">
    <circle cx="121.4" cy="359.6" r="3"/>
    <circle cx="144.2" cy="358.8" r="3"/>
    <circle cx="224.0" cy="356.0" r="3"/>
    <circle cx="338.0" cy="352.1" r="3"/>
    <circle cx="680.0" cy="340.1" r="3"/>
  </g>

  <!-- end labels -->
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" font-weight="600">
    <text x="688" y="57" fill="#2f6feb">单人 187 万</text>
    <text x="688" y="80" fill="#6b7280">裸平台 177 万</text>
    <text x="688" y="322" fill="#d97706">团队 3 人 21.6 万</text>
    <text x="688" y="344" fill="#0d9488">团队 2 人 12.4 万</text>
  </g>

  <!-- legend -->
  <g font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="11.5" fill="#1f2328">
    <line x1="118" y1="72" x2="136" y2="72" stroke="#2f6feb" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="142" y="76">单人（虚线＝外推）</text>
    <line x1="392" y1="72" x2="410" y2="72" stroke="#6b7280" stroke-width="2"/>
    <text x="416" y="76">裸平台 standard</text>
    <line x1="118" y1="96" x2="136" y2="96" stroke="#d97706" stroke-width="2"/>
    <text x="142" y="100">团队 3 人</text>
    <line x1="392" y1="96" x2="410" y2="96" stroke="#0d9488" stroke-width="2"/>
    <text x="416" y="100">团队 2 人</text>
  </g>
</svg>
